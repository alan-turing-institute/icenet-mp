---
name: Research Argo final checks

on:  # yamllint disable-line rule:truthy
  push:
    branches: [research/argo-sparse-encoding-477]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.3"
      - name: Run tests
        run: uv run --group dev pytest
      - name: Run mypy
        run: uv run --group dev mypy .
      - name: Run Ruff check
        if: matrix.python-version == '3.11'
        run: |
          set +e
          uvx --from ruff==0.16.3 ruff check . > ruff-check.txt 2>&1
          code=$?
          cat ruff-check.txt
          echo "RUFF_CHECK_EXIT=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Upload Ruff diagnostics
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: argo-ruff-diagnostics
          path: ruff-check.txt
      - name: Enforce Ruff check
        if: matrix.python-version == '3.11'
        run: test "${RUFF_CHECK_EXIT}" -eq 0
      - name: Run Ruff format check
        if: matrix.python-version == '3.11'
        run: uvx --from ruff==0.16.3 ruff format --check .
      - name: Run pre-commit
        if: matrix.python-version == '3.11'
        run: uv run --group dev pre-commit run --hook-stage manual --all-files

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.3"
      - name: Run real Argo benchmark
        run: >-
          uv run python -m icenet_mp.research.run_argo_sparse_benchmark
          --train-date 2024-06-17T12:00:00
          --train-date 2024-06-24T12:00:00
          --train-date 2024-07-01T12:00:00
          --train-date 2024-07-08T12:00:00
          --train-date 2024-07-15T12:00:00
          --eval-date 2024-07-22T12:00:00
          --eval-date 2024-07-29T12:00:00
          --eval-date 2024-08-05T12:00:00
          --seed 477
          --seed 478
          --evaluation-seed 477
          --max-observations 256
          --epochs 20
          --repeats 2
          --learning-rate 0.001
          --output argo_sparse_benchmark.json
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: argo-sparse-benchmark
          path: argo_sparse_benchmark.json
          if-no-files-found: ignore
