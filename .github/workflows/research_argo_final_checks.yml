---
name: Research Argo final checks

on:  # yamllint disable-line rule:truthy
  push:
    branches: [research/argo-sparse-encoding-477]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.3"
      - name: Run tests
        run: uv run --group dev pytest
      - name: Run mypy
        run: uv run --group dev mypy .
      - name: Run Ruff check
        if: matrix.python-version == '3.11'
        run: uvx --from ruff==0.16.4 ruff check .
      - name: Record full-repository Ruff format result
        if: matrix.python-version == '3.11'
        run: |
          set +e
          uvx --from ruff==0.16.4 ruff format --check . > ruff-format-full.txt 2>&1
          code=$?
          cat ruff-format-full.txt
          echo "FULL_RUFF_FORMAT_EXIT=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Ruff format investigation files
        if: matrix.python-version == '3.11'
        run: >-
          uvx --from ruff==0.16.4 ruff format --check
          icenet_mp/research tests/research
      - name: Run pre-commit on all files
        if: matrix.python-version == '3.11'
        run: uv run --group dev pre-commit run --hook-stage manual --all-files
      - name: Show full Ruff format status
        if: matrix.python-version == '3.11'
        run: echo "Full repository Ruff format exit=${FULL_RUFF_FORMAT_EXIT}"

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.3"
      - name: Run real Argo benchmark by training seed
        run: |
          for seed in 477 478; do
            uv run python -m icenet_mp.research.run_argo_sparse_benchmark \
              --train-date 2024-06-17T12:00:00 \
              --train-date 2024-06-24T12:00:00 \
              --train-date 2024-07-01T12:00:00 \
              --train-date 2024-07-08T12:00:00 \
              --train-date 2024-07-15T12:00:00 \
              --eval-date 2024-07-22T12:00:00 \
              --eval-date 2024-07-29T12:00:00 \
              --eval-date 2024-08-05T12:00:00 \
              --seed "$seed" \
              --evaluation-seed 477 \
              --max-observations 256 \
              --epochs 20 \
              --repeats 2 \
              --learning-rate 0.001 \
              --output "argo_sparse_benchmark_seed_${seed}.json"
          done
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: argo-sparse-benchmark
          path: argo_sparse_benchmark_seed_*.json
          retention-days: 7
