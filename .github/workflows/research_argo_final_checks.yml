---
name: Research Argo final checks

on:  # yamllint disable-line rule:truthy
  push:
    branches: [research/argo-sparse-encoding-477]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.3"
      - name: Run tests
        run: uv run --group dev pytest
      - name: Run mypy
        run: uv run --group dev mypy .
      - name: Run Ruff check
        if: matrix.python-version == '3.11'
        run: uvx --from ruff==0.16.4 ruff check .
      - name: Record full-repository Ruff format result
        if: matrix.python-version == '3.11'
        run: |
          set +e
          uvx --from ruff==0.16.4 ruff format --check . > ruff-format-full.txt 2>&1
          code=$?
          cat ruff-format-full.txt
          echo "FULL_RUFF_FORMAT_EXIT=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Ruff format investigation files
        if: matrix.python-version == '3.11'
        run: >-
          uvx --from ruff==0.16.4 ruff format --check
          icenet_mp/research tests/research
      - name: Run pre-commit on all files
        if: matrix.python-version == '3.11'
        run: uv run --group dev pre-commit run --hook-stage manual --all-files
      - name: Show full Ruff format status
        if: matrix.python-version == '3.11'
        run: echo "Full repository Ruff format exit=${FULL_RUFF_FORMAT_EXIT}"
