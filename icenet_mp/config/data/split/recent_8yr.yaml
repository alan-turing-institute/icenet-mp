batch_size: 2

# Recent-regime training subset: the 8 most recent non-held-out years. Arctic ice has
# thinned and become more mobile since the start of the record, so when trading data
# for speed we keep the years closest to the regime we forecast. Holdout (predict),
# test and 2021 validation years match full_dataset_from_1999 so results stay
# comparable; validation drops 2000 (validating a recent-regime model on 25-year-old
# ice would distort early stopping).

# This data is a holdout set not to be used until we are ready to produce final outputs (e.g. a paper)
# Data from 2013 and 2023
predict:
  - start: 2013-01-01
    end: 2013-12-31
  - start: 2023-01-01
    end: 2023-12-31

# This data is a test set used to compare fully-trained models (e.g. on the project leaderboard)
# Data from 2019
test:
  - start: 2019-01-01
    end: 2019-12-31

# This data is used for training the model
# Data from 2014-2018, 2020, 2022 and 2024 (8 recent years)
train:
  - start: 2014-01-01
    end: 2018-12-31
  - start: 2020-01-01
    end: 2020-12-31
  - start: 2022-01-01
    end: 2022-12-31
  - start: 2024-01-01
    end: 2024-12-31

# This data is used for validation during training (e.g. for early stopping etc.)
# Data from 2021
validate:
  - start: 2021-01-01
    end: 2021-12-31
