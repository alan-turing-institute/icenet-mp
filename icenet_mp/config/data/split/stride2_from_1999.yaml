batch_size: 2

# Same training years as full_dataset_from_1999 but with train_stride 2: only every
# second valid window start date is used. Consecutive windows overlap in all but one
# timestep, so this halves the samples per epoch while keeping the full 1999-2024
# spread of years/regimes. Validation is 2021 only, matching recent_8yr.yaml, so the
# two speed-oriented splits are directly comparable.
train_stride: 2

# This data is a holdout set not to be used until we are ready to produce final outputs (e.g. a paper)
# Data from 2013 and 2023
predict:
  - start: 2013-01-01
    end: 2013-12-31
  - start: 2023-01-01
    end: 2023-12-31

# This data is a test set used to compare fully-trained models (e.g. on the project leaderboard)
# Data from 2019
test:
  - start: 2019-01-01
    end: 2019-12-31

# This data is used for training the model
# Data from 1999-2012, 2014-2018, 2020, 2022 and 2024 (every 2nd window start date)
train:
  - start: 1999-01-01
    end: 1999-12-31
  - start: 2001-01-01
    end: 2012-12-31
  - start: 2014-01-01
    end: 2018-12-31
  - start: 2020-01-01
    end: 2020-12-31
  - start: 2022-01-01
    end: 2022-12-31
  - start: 2024-01-01
    end: 2024-12-31

# This data is used for validation during training (e.g. for early stopping etc.)
# Data from 2021
validate:
  - start: 2021-01-01
    end: 2021-12-31
