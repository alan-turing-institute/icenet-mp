samp-sicsouth-osisaf-25p0km-2017-2019-24h-v3:
  name: samp-sicsouth-osisaf-25p0km-2017-2019-24h-v3
  group_as: sic-osisaf
  description: Sea ice concentration from SMMR/SSMI/SSMIS + AMSR-E/AMSR-2 + AMSR2 for southern hemisphere
  attribution: EUMETSAT/OSISAF
  licence: CC-BY-4.0

  dates:
    start: '2017-01-01T12:00:00'
    end: '2019-01-31T12:00:00'
    frequency: 24h

  input:
    pipe:
      - concat:
        # OSI-450-a1 [SMMR, SSM/I, SSMIS] (1978-2002)
        # https://osi-saf.eumetsat.int/products/osi-450-a1
        - dates:
            start: '1978-10-25T12:00:00'
            end: '2002-12-31T12:00:00'
            frequency: 24h
          ftp:
            url: ftp://osisaf.met.no/reprocessed/ice/conc/v3p1/{date:strftime(%Y)}/{date:strftime(%m)}/ice_conc_sh_ease2-250_cdr-v3p1_{date:strftime(%Y%m%d)}1200.nc

        # OSI-458 [ASMR-E] (2003-2011)
        # https://osi-saf.eumetsat.int/products/osi-458
        - dates:
            start: '2003-01-01T12:00:00'
            end: '2011-10-04T12:00:00'
            frequency: 24h
          ftp:
            url: ftp://osisaf.met.no/reprocessed/ice/conc_amsr/v3p0/{date:strftime(%Y)}/{date:strftime(%m)}/ice_conc_sh_ease2-250_cdr-v3p0-amsr_{date:strftime(%Y%m%d)}1200.nc

        # OSI-450-a1 [SMMR, SSM/I, SSMIS] (2011-2012)
        # https://osi-saf.eumetsat.int/products/osi-450-a1
        - dates:
            start: '2011-10-05T12:00:00'
            end: '2012-07-23T12:00:00'
            frequency: 24h
          ftp:
            url: ftp://osisaf.met.no/reprocessed/ice/conc/v3p1/{date:strftime(%Y)}/{date:strftime(%m)}/ice_conc_sh_ease2-250_cdr-v3p1_{date:strftime(%Y%m%d)}1200.nc

        # OSI-458 [AMSR-2] (2012-2020)
        # https://osi-saf.eumetsat.int/products/osi-458
        - dates:
            start: '2012-07-24T12:00:00'
            end: '2020-12-31T12:00:00'
            frequency: 24h
          ftp:
            url: ftp://osisaf.met.no/reprocessed/ice/conc_amsr/v3p0/{date:strftime(%Y)}/{date:strftime(%m)}/ice_conc_sh_ease2-250_cdr-v3p0-amsr_{date:strftime(%Y%m%d)}1200.nc

        # OSI-438 [AMSR2] (2021-2025)
        # https://osi-saf.eumetsat.int/products/osi-438
        - dates:
            start: '2021-01-01T12:00:00'
            end: '2025-12-31T12:00:00'
            frequency: 24h
          ftp:
            url: ftp://osisaf.met.no/reprocessed/ice/conc-cont-reproc-amsr/v3p0/{date:strftime(%Y)}/{date:strftime(%m)}/ice_conc_sh_ease2-250_icdr-v3p0-amsr_{date:strftime(%Y%m%d)}1200.nc

      # Drop unnecessary variables
      - drop:
          param: [algorithm_standard_uncertainty, raw_ice_conc_values, smearing_standard_uncertainty]

      # Rescale concentration variables and uncertainties from percent to fraction
      - rescale:
          scale: 0.01
          offset: 0.0
          param: ice_conc
      - rescale:
          scale: 0.01
          offset: 0.0
          param: total_standard_uncertainty

      # Replace NaNs with 0 throughout
      - nan-to-num:
          variables: [ice_conc, total_standard_uncertainty]
          replace_with: 0.0

      # Set the geography to EASE2 25km grid
      - set-geography:
          crs: "EPSG:6932"
          resolution: "25p0km"
