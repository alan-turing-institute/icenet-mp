demo-sicnorth-icenet-25k-2017-2019-24h-v1:
  name: demo-sicnorth-icenet-25k-2017-2019-24h-v1
  group_as: sic-icenet
  description: OSISAF sea ice concentration for northern hemisphere
  attribution: EUMETSAT
  licence: CC-BY-4.0

  dates:
    start: '2017-01-01T00:00:00'
    end: '2019-12-31T23:00:00'
    frequency: 24h

  preprocessors:
    icenet:
      _target_: icenet_mp.ingestion.preprocessors.IceNetSICPreprocessor
      hemisphere: north
      dates:
        start: ${....dates.start}
        end: ${....dates.end}
        frequency: ${....dates.frequency}

  input:
    netcdf:
      path: ${base_path}/data/preprocessing/${...name}/icenet/data/osisaf/${...preprocessors.icenet.hemisphere}/siconca/*.nc
