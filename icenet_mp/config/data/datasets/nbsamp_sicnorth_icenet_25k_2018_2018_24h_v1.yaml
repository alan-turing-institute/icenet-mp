nbsamp-sicnorth-icenet-25k-2018-2018-24h-v1:
  name: nbsamp-sicnorth-icenet-25k-2018-2018-24h-v1
  group_as: sic-icenet
  description: Sea ice concentration from SMMR/SSMI/SSMIS for northern hemisphere - Summer 2018 (August-September)
  attribution: EUMETSAT
  licence: CC-BY-4.0

  dates:
    start: '2018-08-01T00:00:00'
    end: '2018-09-30T23:00:00'
    frequency: 24h

  preprocessors:
    icenet:
      _target_: icenet_mp.ingestion.preprocessors.IceNetSICPreprocessor
      hemisphere: north
      dates:
        start: ${....dates.start}
        end: ${....dates.end}
        frequency: ${....dates.frequency}

  input:
    netcdf:
      path: ${base_path}/data/preprocessing/${...name}/icenet/data/osisaf/${...preprocessors.icenet.hemisphere}/siconca/2018.nc
