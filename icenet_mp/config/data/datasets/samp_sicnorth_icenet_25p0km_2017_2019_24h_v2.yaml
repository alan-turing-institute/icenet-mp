samp-sicnorth-icenet-25p0km-2017-2019-24h-v2:
  name: samp-sicnorth-icenet-25p0km-2017-2019-24h-v2
  group_as: sic-icenet
  description: Sea ice concentration from SMMR/SSMI/SSMIS for northern hemisphere
  attribution: EUMETSAT/OSISAF
  licence: CC-BY-4.0

  dates:
    start: '2017-01-01T00:00:00'
    end: '2019-01-31T23:00:00'
    frequency: 24h

  preprocessors:
    icenet:
      _target_: icenet_mp.ingestion.preprocessors.IceNetSICPreprocessor
      hemisphere: north
      dates:
        start: ${....dates.start}
        end: ${....dates.end}
        frequency: ${....dates.frequency}

  input:
    pipe:
      # Download the raw data
      - netcdf:
          path: ${base_path}/data/preprocessing/${.....name}/icenet/data/osisaf/${.....preprocessors.icenet.hemisphere}/siconca/*.nc

      # Set the geography to EASE2 25km grid
      - set-geography:
          crs: "EPSG:6931"
          resolution: "25p0km"
