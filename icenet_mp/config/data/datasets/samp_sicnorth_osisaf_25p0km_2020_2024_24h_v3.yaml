samp-sicnorth-osisaf-25p0km-2020-2024-24h-v3:
  name: samp-sicnorth-osisaf-25p0km-2020-2024-24h-v3
  group_as: sic-osisaf
  description: Sea ice concentration from SMMR/SSMI/SSMIS + AMSR-E/AMSR-2 + AMSR2 for northern hemisphere
  attribution: EUMETSAT/OSISAF
  licence: CC-BY-4.0

  dates:
    start: '2020-01-01T12:00:00'
    end: '2024-07-31T12:00:00'
    frequency: 24h
    missing:
    - start: 2022-01-01T12:00:00
      end: 2022-06-30T12:00:00
    - start: 2022-08-01T12:00:00
      end: 2022-12-31T12:00:00
    - start: 2023-02-01T12:00:00
      end: 2023-12-31T12:00:00
    - start: 2024-02-01T12:00:00
      end: 2024-06-30T12:00:00

  input:
    pipe:
      - concat:
        # OSI-458 [AMSR-2] (2012-2020)
        # https://osi-saf.eumetsat.int/products/osi-458
        - dates:
            start: '2012-07-24T12:00:00'
            end: '2020-12-31T12:00:00'
            frequency: 24h
          ftp:
            url: ftp://osisaf.met.no/reprocessed/ice/conc_amsr/v3p0/{date:strftime(%Y)}/{date:strftime(%m)}/ice_conc_nh_ease2-250_cdr-v3p0-amsr_{date:strftime(%Y%m%d)}1200.nc

        # OSI-438 [AMSR2] (2021-2025)
        # https://osi-saf.eumetsat.int/products/osi-438
        - dates:
            start: '2021-01-01T12:00:00'
            end: '2025-12-31T12:00:00'
            frequency: 24h
          ftp:
            url: ftp://osisaf.met.no/reprocessed/ice/conc-cont-reproc-amsr/v3p0/{date:strftime(%Y)}/{date:strftime(%m)}/ice_conc_nh_ease2-250_icdr-v3p0-amsr_{date:strftime(%Y%m%d)}1200.nc

      # Drop unnecessary variables
      - drop:
          param: [algorithm_standard_uncertainty, raw_ice_conc_values, smearing_standard_uncertainty]

      # Rescale concentration variables and uncertainties from percent to fraction
      - rescale:
          scale: 0.01
          offset: 0.0
          param: ice_conc
      - rescale:
          scale: 0.01
          offset: 0.0
          param: total_standard_uncertainty

      # Replace NaNs with 0 throughout
      - nan-to-num:
          variables: [ice_conc, total_standard_uncertainty]
          replace_with: 0.0

      # Set the geography to EASE2 25km grid
      - set-geography:
          crs: "EPSG:6931"
          resolution: "25p0km"
