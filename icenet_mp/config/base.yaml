# Base config inherited by all other configs
defaults:
  - data: sample_south
  - evaluate: default
  - loggers:
    - wandb
  - loss: amse
  - model: quick_test
  - predict: sic-osisaf-2d
  - random: default
  - train: default
  - platform: default
  - _self_

data:
  # Set to a value such as -1.0 to keep windows with missing input dates.
  # Forecast target dates are always required and are never filled.
  missing_input_value: null
