_target_: icenet_mp.models.EncodeProcessDecode

name: cnn-unet-cnn-enhanced

# Separate file from cnn_unet_cnn.yaml (same pattern as cnn_vit_cnn_enhanced.yaml) so
# the original baseline stays untouched and the two can be run side by side. This is
# the UNet arm of the bake-off in next_steps.md: the same enhancement set as
# baseline/03c_cnn_vit_cnn_residual (motion channels, day-order channels, skip
# connection, residual/persistence-delta output) on top of the cnn-unet-cnn
# arrangement, plus GroupNorm everywhere -- BatchNorm's train/eval statistics
# divergence is known to collapse the UNet processor at batch size ~2, and GroupNorm
# was the fix that made the ViT refinement head safe at the same batch size.

encoders:
  latent_space: [144, 144]
  era5:
    _target_: icenet_mp.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    norm_type: groupnorm
    scale_factor: 3
  float-argo:
    _target_: icenet_mp.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    norm_type: groupnorm
    scale_factor: 3
  sic-icenet:
    _target_: icenet_mp.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    norm_type: groupnorm
    scale_factor: 3
  sic-ssmis:
    _target_: icenet_mp.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    norm_type: groupnorm
    scale_factor: 3

processor:
  _target_: icenet_mp.models.processors.UNetProcessor
  norm_type: groupnorm
  start_out_channels: 128

decoder:
  _target_: icenet_mp.models.decoders.CNNDecoder
  kernel_size: 5
  mask_type: active
  n_layers: 1
  norm_type: groupnorm
  # The decoder output is a delta from persistence (see use_residual_output), so it
  # must be allowed to go negative; the model clamps the final sum to [0, 1] instead.
  restrict_range: none
  scale_factor: 3

use_motion_channels: true
use_day_order_channels: true
use_skip_connection: true
use_residual_output: true
