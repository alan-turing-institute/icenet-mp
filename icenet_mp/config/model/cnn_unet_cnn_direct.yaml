_target_: icenet_mp.models.EncodeProcessDecode

name: cnn-unet-cnn-direct

# Same as cnn_unet_cnn_enhanced.yaml, except the processor is UNetDirectProcessor: it
# predicts all n_forecast_steps in one forward pass instead of BaseProcessor's default
# autoregressive rollout. Mirrors baseline/03d_cnn_vit_cnn_direct's change to the ViT
# arm -- isolates the effect of removing the ~14x sequential-pass cost on the UNet
# processor specifically.

encoders:
  latent_space: [144, 144]
  era5:
    _target_: icenet_mp.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    norm_type: groupnorm
    scale_factor: 3
  float-argo:
    _target_: icenet_mp.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    norm_type: groupnorm
    scale_factor: 3
  sic-icenet:
    _target_: icenet_mp.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    norm_type: groupnorm
    scale_factor: 3
  sic-ssmis:
    _target_: icenet_mp.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    norm_type: groupnorm
    scale_factor: 3

processor:
  _target_: icenet_mp.models.processors.UNetDirectProcessor
  norm_type: groupnorm
  start_out_channels: 128

decoder:
  _target_: icenet_mp.models.decoders.CNNDecoder
  kernel_size: 5
  mask_type: active
  n_layers: 1
  norm_type: groupnorm
  restrict_range: none
  scale_factor: 3
  skip_connection:
    method: additive

use_motion_channels: true
use_day_order_channels: true
use_skip_connection: true
