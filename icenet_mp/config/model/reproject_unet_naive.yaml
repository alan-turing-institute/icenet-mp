_target_: icenet_mp.models.EncodeProcessDecode

name: reproject-unet-naive

encoders:
  latent_space: [432, 432]
  era5:
    _target_: icenet_mp.models.encoders.ReprojectionEncoder
    project_to: "sic-icenet"
  float-argo:
    _target_: icenet_mp.models.encoders.ReprojectionEncoder
    project_to: "sic-icenet"
  sic-icenet:
    _target_: icenet_mp.models.encoders.NaiveLinearEncoder
  sic-ssmis:
    _target_: icenet_mp.models.encoders.NaiveLinearEncoder

processor:
  _target_: icenet_mp.models.processors.UNetProcessor
  start_out_channels: 64

decoder:
  _target_: icenet_mp.models.decoders.NaiveLinearDecoder
  restrict_range: none # How to bound output into [0,1]: none/sigmoid/clamp/tanh
