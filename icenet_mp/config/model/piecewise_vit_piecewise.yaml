  float-argo:
    _target_: icenet_mp.models.encoders.PiecewiseEncoder
  sic-icenet:
    _target_: icenet_mp.models.encoders.PiecewiseEncoder
  sic-ssmis:
    _target_: icenet_mp.models.encoders.PiecewiseEncoder

processor:
  _target_: icenet_mp.models.processors.VitProcessor

