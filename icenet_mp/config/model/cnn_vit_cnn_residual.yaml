# cnn-vit-cnn with the forecast loop closed in PHYSICAL space and a residual
# (tendency) head. Identical blocks and sizes to cnn_vit_cnn.yaml; the only
# differences are the rollout flags and the decoder's range restriction:
#   rollout_space: physical   each forecast step encodes the current window of
#                             physical frames, takes one processor step, decodes,
#                             and rolls the updated PHYSICAL field into the window
#                             (re-encoded next step) - instead of feeding the
#                             processor's raw latent back into its own input
#   predict_residual: true    the decoder output is a signed daily INCREMENT:
#                             x_{k+1} = mask(clip(x_k + delta_k, 0, 1)); the
#                             identity forecast (persistence) is delta = 0
#   zero_init_tendency: true  the final decoder convolution starts at zero, so an
#                             untrained model reproduces (masked) persistence
#                             bit-exactly at every lead
#   feedback_channel: 1       sic-ssmis carries 6 channels; the prediction
#                             overwrites ice_conc (index 1) when fed back
#   restrict_range: none      the increment is signed and must not be squashed;
#                             the SUM is clipped instead (enforced in the model)
_target_: icenet_mp.models.EncodeProcessDecode

name: cnn-vit-cnn-residual

rollout_space: physical
predict_residual: true
zero_init_tendency: true
feedback_channel: 1

encoders:
  latent_space: [216, 216]
  era5:
    _target_: icenet_mp.models.encoders.CNNEncoder
    n_layers: 1
  float-argo:
    _target_: icenet_mp.models.encoders.CNNEncoder
    n_layers: 1
  sic-icenet:
    _target_: icenet_mp.models.encoders.CNNEncoder
    n_layers: 1
  sic-ssmis:
    _target_: icenet_mp.models.encoders.CNNEncoder
    n_layers: 1

processor:
  _target_: icenet_mp.models.processors.VitProcessor
  depth: 6
  dropout: 0.1
  emb_dim: 256
  heads: 8
  mlp_dim: 1024
  patch_size: 24

decoder:
  _target_: icenet_mp.models.decoders.CNNDecoder
  n_layers: 1
  mask_type: active
  norm_type: groupnorm
  restrict_range: none
