_target_: icenet_mp.models.EncodeProcessDecode

name: naive-null-naive

encoders:
  latent_space: [432, 432]
  era5:
    _target_: icenet_mp.models.encoders.NaiveLinearEncoder
  float-argo:
    _target_: icenet_mp.models.encoders.NaiveLinearEncoder
  sic-icenet:
    _target_: icenet_mp.models.encoders.NaiveLinearEncoder
  sic-ssmis:
    _target_: icenet_mp.models.encoders.NaiveLinearEncoder

processor:
  _target_: icenet_mp.models.processors.NullProcessor

decoder:
  _target_: icenet_mp.models.decoders.NaiveLinearDecoder
  restrict_range: sigmoid # How to bound output into [0,1]: none/sigmoid/clamp/tanh
  mask_type: active # Output mask: active (active+land) | land (land only) | none
