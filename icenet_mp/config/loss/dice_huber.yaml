# =============================================================================
# Dice + Huber Loss
# =============================================================================
# HuberLoss (see loss/huber.yaml) plus a soft-Dice term. HuberLoss is per-pixel and
# unweighted, so a thin boundary ring barely moves the aggregate loss compared to a
# large interior/background -- Dice is not sensitive to region size, so it gives the
# boundary much stronger, more direct gradient pressure to sharpen.
# =============================================================================

_target_: icenet_mp.losses.DiceHuberLoss
delta: 0.5 # HuberLoss's quadratic->linear transition, matches loss/huber.yaml
dice_weight: 1.0 # Weight of the soft-Dice term relative to Huber
