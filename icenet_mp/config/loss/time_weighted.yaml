# Lead-time weighted loss
#
# Applies the wrapped loss independently to each forecast step and increases
# its contribution linearly with lead time. Weights are normalised to mean 1,
# so the average loss scale is preserved.
#
# The nested base loss can be replaced in a custom loss config if required.
#
_target_: icenet_mp.losses.time_weighted_loss.TimeWeightedLoss

base_loss:
  _target_: torch.nn.HuberLoss
  delta: 0.5

initial_weight: 1.0
final_weight: 2.0
