# @package _global_
# Opt-in sampled-map RF screening. Scalar RF (rf.mode: scalar) remains the default.
defaults:
  - /base
  - override /data: full_north_from_1999
  - _self_

rf:
  mode: spatial
  n_estimators: 300
  max_depth: 15
  min_samples_leaf: 5
  min_samples_split: 8
  max_features: sqrt
  random_state: 42
  n_jobs: 1
  n_history_steps: 3
  n_forecast_steps: 14
  target:
    group_as: sic-ssmis
    variable: ice_conc
  spatial:
    # Static geographic mask generated by `imp datasets create` for the SIC dataset.
    mask_dataset_name: full-sicnorth-ssmis-25p0km-1979-2024-24h-v2
    seed: 42
    locations_per_stratum: 32
    max_initialisations: 500
    max_rows: 48000
    row_batch_size: 1024
    open_water_max: 0.15
    pack_ice_min: 0.8
    permutation_repeats: 10
    confirmation_groups: []  # Optional physical-variable groups for add/drop refits.
