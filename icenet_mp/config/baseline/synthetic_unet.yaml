# @package _global_
#
# Fast synthetic-data pipeline check: the real, unmodified baseline/01_unet model
# (unet architecture, its own tuned lr/weight_decay) against several independent
# bouncing-circle trajectories instead of real sea-ice data. Whole trajectories are
# held out for validation/test, so passing this requires learning the general
# translate-and-bounce rule, not memorising one instance. Run with:
#   imp synthetic-check --config-name baseline/synthetic_unet
defaults:
  - /baseline/01_unet
  - override /data: synthetic
  - override /predict: synthetic-2d
  - override /train: synthetic
  - override /evaluate: synthetic
  - override /loggers:
    - local_files
    - loss_history
  - _self_

# encoders.latent_space is set at runtime to match whatever --grid-size is used (see
# run_synthetic_pipeline_check), not overridden here -- this only reshapes the working
# resolution to match the data, not the model's capacity. There is no land, so masking
# is disabled. The model's own architecture/width and baseline/01_unet's tuned
# optimizer settings are otherwise left untouched.
model:
  decoder:
    mask_type: none
  # The synthetic field is a single moving circle with a well-defined centre, so the
  # value-weighted centroid distance is a meaningful summary here (unlike on real
  # multi-region sea ice, where it is off by default).
  metrics:
    - accuracy
    - mae
    - rmse
    - sieerror
    - centroid_error

random:
  seed: 1234
