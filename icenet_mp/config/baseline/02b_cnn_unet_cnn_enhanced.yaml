# @package _global_
defaults:
  - /base
  - override /model: cnn_unet_cnn_enhanced
  - _self_

# UNet arm of the bake-off in next_steps.md: cnn-unet-cnn with the same enhancement
# set as baseline/03c_cnn_vit_cnn_residual (motion/day-order channels, skip
# connection, residual/persistence-delta output) plus GroupNorm throughout, so the
# only architectural difference vs 03c is the processor (UNet with internal
# multi-scale skips instead of the patchified ViT). Optimizer settings match
# baseline/01_unet's tuned values, which are also what 03b/03c use.
# Ablate individual enhancements from the CLI, e.g. `model.decoder.skip_connection.method=none
# model.decoder.restrict_range=sigmoid`.
train:
  optimizer:
    lr: 1e-3
    weight_decay: 0.05
