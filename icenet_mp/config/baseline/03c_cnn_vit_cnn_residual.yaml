# @package _global_
defaults:
  - /base
  - override /model: cnn_vit_cnn_enhanced
  - _self_

# Variant of baseline/03b_cnn_vit_cnn_enhanced.yaml targeting the blur diagnosed in
# next_steps.md: on the 2021 validation year both CNN-ViT-CNN runs lose to persistence
# on every pixelwise metric through lead day ~8, and day-1 RMSE is ~2x persistence --
# the field cannot pass intact through the 81-token ViT bottleneck. An additive
# decoder skip connection makes persistence the model's zero-effort starting point
# instead of something it must reconstruct: the decoder output becomes a *delta*
# added onto the last observed frame, clamped to [0, 1]. Requires
# decoder.restrict_range: none so the delta can be negative; the final clamp bounds
# the sum instead.
# Ablate with `model.decoder.skip_connection.method=none` to attribute gains.
model:
  name: cnn-vit-cnn-residual
  decoder:
    restrict_range: none
    skip_connection:
      method: additive

train:
  optimizer:
    lr: 1e-3
    weight_decay: 0.05
