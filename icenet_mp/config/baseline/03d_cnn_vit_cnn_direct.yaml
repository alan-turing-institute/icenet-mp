# @package _global_
defaults:
  - /base
  - override /model: cnn_vit_cnn_direct
  - _self_

# Same as baseline/03c_cnn_vit_cnn_residual.yaml (skip connection + residual output),
# but with the processor swapped to VitDirectProcessor: predicts all n_forecast_steps
# in one forward pass instead of the default autoregressive rollout. Isolates the
# effect of removing the ~14x sequential-pass cost -- everything else (encoder,
# patchification, refine head, skip/residual, optimizer settings) is identical to
# 03c, so any speed/accuracy difference is attributable to the rollout change alone.

train:
  optimizer:
    lr: 1e-3
    weight_decay: 0.05
