# @package _global_
#
# Fast synthetic-data pipeline check: the real, unmodified baseline/03_cnn_vit_cnn
# model (CNN encode -> ViT process -> CNN decode) against several independent
# bouncing-circle trajectories instead of real sea-ice data. Whole trajectories are
# held out for validation/test, so passing this requires learning the general
# translate-and-bounce rule, not memorising one instance. Run with:
#   imp synthetic check --config-name baseline/synthetic_cnn_vit --grid-size 48
#
# Grid-size constraint: the ViT processor patchifies the latent grid with
# patch_size=24, so --grid-size must be a multiple of 24; the pipeline check itself
# also requires a multiple of 16 (UNetProcessor's constraint, applied to every model).
# Use a multiple of 48 (the least common multiple): 48 is the smallest working grid,
# 144 is a sensible midsize, 432 matches the real-data resolution. The default
# --grid-size 32 will NOT work for this model.
defaults:
  - /baseline/03_cnn_vit_cnn
  - override /data: synthetic
  - override /predict: synthetic-2d
  - override /train: synthetic
  - override /evaluate: synthetic
  - override /loggers:
    - local_files
  - _self_

# encoders.latent_space is set at runtime to match whatever --grid-size is used (see
# run_synthetic_pipeline_check), not overridden here -- this only reshapes the working
# resolution to match the data, not the model's capacity. There is no land, so masking
# is disabled. The model's own architecture/width and the default optimizer settings
# are otherwise left untouched.
model:
  decoder:
    mask_type: none

# baseline/03_cnn_vit_cnn inherits the global default lr=5e-3, which learns too
# slowly through the sigmoid range restriction to pass the check's improvement gate
# in 30 epochs (~20% improvement, 30% required). Match baseline/01_unet's tuned
# optimizer settings instead -- the same values every tuned baseline uses.
train:
  optimizer:
    lr: 1e-3
    weight_decay: 0.05

random:
  seed: 1234
